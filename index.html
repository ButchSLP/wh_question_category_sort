<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who, Where, When, What - Interactive Sort</title>
    <style>
        :root {
            --who-grad: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            --where-grad: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --when-grad: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            --what-grad: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-color: #ffd49f;
        }

        /* HARD LOCK: Prevent any scrollbars from appearing */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1.5vh 2vw;
            transition: background-color 0.4s ease;
        }

        *, *:before, *:after {
            box-sizing: border-box;
        }

        /* --- Screen Wrappers --- */
        #game-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* --- Global Layout Settings --- */
        h1 {
            color: #444;
            margin: 1.5vh 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            font-size: min(2.2rem, 4vh);
            text-align: center;
        }

        p.instruction {
            color: #666;
            margin: 0 0 3vh 0; 
            font-size: min(1rem, 1.8vh);
            text-align: center;
        }

        .bins-container {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 1100px;
            gap: 12px;
            padding: 0.5vh;
            transition: transform 0.3s ease;
        }

        .bin {
            flex: 1;
            height: min(135px, 16vh);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            border: 4px solid white;
            position: relative;
        }

        .bin:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .bin h2 { 
            margin: 0; 
            pointer-events: none; 
            text-transform: uppercase; 
            font-size: min(1.4rem, 2.2vh);
            letter-spacing: 1px;
        }

        .bin span.icon {
            font-size: min(2.6rem, 4.2vh);
            pointer-events: none;
            margin-bottom: 2px;
        }

        .bin[data-category="who"] { background: var(--who-grad); color: #912c2c; }
        .bin[data-category="where"] { background: var(--where-grad); color: #1a5e7a; }
        .bin[data-category="when"] { background: var(--when-grad); color: #7a5a1a; }
        .bin[data-category="what"] { background: var(--what-grad); color: white; }

        .bin.drag-over {
            transform: scale(1.05);
            filter: brightness(1.1);
            border-style: dotted;
        }

        .image-area {
            margin-top: 1.5vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            perspective: 1000px;
            gap: 0.5vh;
        }

        .card {
            background: white;
            padding: 1vh;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            position: relative;
            z-index: 1;
        }

        #draggable-image {
            width: min(190px, 23vh);
            height: min(190px, 23vh);
            object-fit: cover;
            border-radius: 12px;
            cursor: grab;
            display: block;
            touch-action: none;
        }

        #draggable-image:active { cursor: grabbing; }

        .progress-bar {
            width: min(350px, 50vw);
            height: 10px;
            background: #ddd;
            border-radius: 10px;
            margin-top: 1vh;
            overflow: hidden;
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background: #4CAF50;
            transition: width 0.3s;
        }

        .progress-text {
            margin-top: 0.5vh;
            font-weight: bold;
            color: #555;
            font-size: min(0.95rem, 1.8vh);
        }

        #feedback {
            height: 4vh;
            font-size: min(1.8rem, 3.2vh);
            font-weight: bold;
            transition: opacity 0.3s;
            position: relative;
            z-index: 10;
            margin-bottom: 0.5vh;
        }

        .hidden { display: none !important; }

        /* --- Dedicated Full Win Screen Styling --- */
        .win-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2vh;
            animation: popIn 0.5s ease-out;
            width: 100%;
            max-width: 860px; 
            margin: auto;     
        }

        /* Large Fixed Overlay GIF for results view without text blocking */
        .fluttershy-gif {
            position: fixed;
            top: 2vh;
            left: 2vw;
            width: min(400px, 22vw);
            height: auto;
            z-index: 1000;
        }

        #win-percentage {
            font-size: min(3rem, 6vh);
            font-weight: bold;
            color: #2e7d32;
            margin: 1vh 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 500px;
            margin: 2.5vh auto; 
        }

        .stats-card {
            padding: 1.5vh;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border: 3px solid white;
            text-align: center;
        }

        .stats-card h4 {
            margin: 4px 0;
            font-size: min(1.3rem, 2.4vh);
        }

        .stats-card p {
            margin: 3px 0;
            font-size: min(1rem, 2vh);
            font-weight: bold;
        }

        .val-correct { color: #1b5e20; }
        .val-incorrect { color: #b71c1c; }
        .dark-card .val-correct { color: #b9f6ca; }
        .dark-card .val-incorrect { color: #ff8a80; }

        button {
            padding: 1.5vh 5vw;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #388E3C;
            transition: 0.1s;
            font-size: min(1.3rem, 2.2vh);
            margin-top: 1.5vh;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #388E3C;
        }

        #fx-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* --- LAPTOP/DESKTOP OPTIMIZATIONS (Scroll-Free Bounded) --- */
        @media (min-width: 1025px) {
            body { padding: 1vh 2vw; }
            h1 { font-size: min(2.5rem, 4.5vh); margin-top: 2.5vh; }
            p.instruction { font-size: min(1.1rem, 2vh); margin-bottom: 3.5vh; } 

            .bins-container { max-width: 1100px; gap: 1.5vw; }
            
            .bin {
                height: min(175px, 22vh); 
                border-width: 5px;
                border-radius: 25px;
            }
            .bin h2 { font-size: min(1.8rem, 2.6vh); }
            .bin span.icon { font-size: min(3.5rem, 5vh); margin-bottom: 2px; }

            .image-area {
                margin-top: 3vh; 
                gap: 1vh; 
            }

            #feedback { 
                font-size: min(2.2rem, 3.6vh); 
                height: 4.5vh; 
                line-height: 4.5vh;
            }

            #draggable-image {
                width: min(360px, 30vh); 
                height: min(360px, 30vh);
            }
            .card { padding: 1.2vh; }

            .progress-bar { height: 30px; width: 380px; margin-top: 4vh; }
            .progress-text { font-size: min(1rem, 1.8vh); }
            
            button { font-size: 1.4rem; }
            .win-screen h2 { font-size: 2.8rem; }
            .win-screen p { font-size: 1.4rem; }
        }

        /* Mobile/Portrait Tablet Constraints */
        @media (max-width: 650px) {
            .bins-container {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .bin {
                height: min(95px, 11vh);
            }
            .bin span.icon {
                font-size: min(2rem, 3.5vh);
            }
            .bin h2 {
                font-size: min(1.2rem, 2vh);
            }
            #draggable-image {
                width: min(160px, 22vh);
                height: min(160px, 22vh);
            }
        }

        @media (min-width: 651px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
                max-width: 800px; 
            }
        }
    </style>
</head>
<body>

    <canvas id="fx-canvas"></canvas>

    <audio id="win-audio" src="kpop_song.mp3" loop></audio>

    <div id="game-screen">
        <h1>Wh-Question Sorting Challenge</h1>
        <p class="instruction">Drag the picture to the correct question word.</p>

        <div class="bins-container" id="bins-box">
            <div class="bin" data-category="who" onclick="speakBin('Who')" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)">
                <span class="icon">👤</span>
                <h2>Who</h2>
            </div>
            <div class="bin" data-category="where" onclick="speakBin('Where')" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)">
                <span class="icon">📍</span>
                <h2>Where</h2>
            </div>
            <div class="bin" data-category="when" onclick="speakBin('When')" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)">
                <span class="icon">🕒</span>
                <h2>When</h2>
            </div>
            <div class="bin" data-category="what" onclick="speakBin('What')" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)">
                <span class="icon">📦</span>
                <h2>What</h2>
            </div>
        </div>

        <div id="game-wrap" class="image-area">
            <div id="feedback"></div>
            <div class="card">
                <img id="draggable-image" draggable="true" ondragstart="drag(event)" onclick="speakImage()" src="" alt="Item">
            </div>
            
            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <div class="progress-text">Progress: <span id="current-count">1</span> / <span id="total-count">0</span></div>
        </div>
    </div>

    <div id="win-screen" class="win-screen hidden">
        <img src="fluttershy.gif" alt="Fluttershy Cheer" class="fluttershy-gif">

        <span style="font-size: min(5rem, 9vh);">🏆</span>
        <h2 id="win-title">Amazing Job!</h2>
        <div id="win-percentage">0% Correct</div>
        <p id="win-score"></p>
        
        <div class="stats-grid">
            <div class="stats-card" style="background: var(--who-grad); color: #912c2c;">
                <span style="font-size: 1.6rem;">👤</span>
                <h4>Who</h4>
                <p>Correct: <span id="who-correct" class="val-correct">0</span></p>
                <p>Incorrect: <span id="who-incorrect" class="val-incorrect">0</span></p>
            </div>
            <div class="stats-card" style="background: var(--where-grad); color: #1a5e7a;">
                <span style="font-size: 1.6rem;">📍</span>
                <h4>Where</h4>
                <p>Correct: <span id="where-correct" class="val-correct">0</span></p>
                <p>Incorrect: <span id="where-incorrect" class="val-incorrect">0</span></p>
            </div>
            <div class="stats-card" style="background: var(--when-grad); color: #7a5a1a;">
                <span style="font-size: 1.6rem;">🕒</span>
                <h4>When</h4>
                <p>Correct: <span id="when-correct" class="val-correct">0</span></p>
                <p>Incorrect: <span id="when-incorrect" class="val-incorrect">0</span></p>
            </div>
            <div class="stats-card dark-card" style="background: var(--what-grad); color: white;">
                <span style="font-size: 1.6rem;">📦</span>
                <h4 style="color: white;">What</h4>
                <p>Correct: <span id="what-correct" class="val-correct">0</span></p>
                <p>Incorrect: <span id="what-incorrect" class="val-incorrect">0</span></p>
            </div>
        </div>

        <button onclick="resetGame()">Play Again</button>
    </div>

    <script>
        let imageData = [
            { src: "images/doctor.jpg", cat: "who", label: "A doctor" },
            { src: "images/beach.jpg", cat: "where", label: "The beach" },
            { src: "images/night_time.jpg", cat: "when", label: "Night time" },
            { src: "images/bicycle.jpg", cat: "what", label: "A bicycle" },
            { src: "images/astronaut.jpg", cat: "who", label: "An astronaut" },
            { src: "images/forest.jpg", cat: "where", label: "The forest" },
            { src: "images/winter.jpg", cat: "when", label: "Winter" },
            { src: "images/sandwich.jpg", cat: "what", label: "A sandwich" },
            { src: "images/firefighter.jpg", cat: "who", label: "A firefighter" },
            { src: "images/school.jpg", cat: "where", label: "A school" },
            { src: "images/morning.jpg", cat: "when", label: "Morning" },
            { src: "images/laptop.jpg", cat: "what", label: "A laptop" },
            { src: "images/grandmother.jpg", cat: "who", label: "A grandmother" },
            { src: "images/outer_space.jpg", cat: "where", label: "Outer space" },
            { src: "images/autumn.jpg", cat: "when", label: "Autumn" },
            { src: "images/guitar.jpg", cat: "what", label: "A guitar" },
            { src: "images/baby.jpg", cat: "who", label: "A baby" },
            { src: "images/mountain.jpg", cat: "where", label: "A mountain" },
            { src: "images/lunchtime.jpg", cat: "when", label: "Lunch time" },
            { src: "images/backpack.jpg", cat: "what", label: "A backpack" },
            { src: "images/scientist.jpg", cat: "who", label: "A scientist" },
            { src: "images/kitchen.jpg", cat: "where", label: "The kitchen" },
            { src: "images/summer.jpg", cat: "when", label: "Summer" },
            { src: "images/hammer.jpg", cat: "what", label: "A hammer" },
            { src: "images/chef.jpg", cat: "who", label: "A chef" },
            { src: "images/library.jpg", cat: "where", label: "A library" },
            { src: "images/sunrise.jpg", cat: "when", label: "Sunrise" },
            { src: "images/umbrella.jpg", cat: "what", label: "An umbrella" },
            { src: "images/pilot.jpg", cat: "who", label: "A pilot" },
            { src: "images/farm.jpg", cat: "where", label: "A farm" },
            { src: "images/bedtime.jpg", cat: "when", label: "Bedtime" },
            { src: "images/camera.jpg", cat: "what", label: "A camera" },
            { src: "images/king.jpg", cat: "who", label: "A king" },
            { src: "images/desert.jpg", cat: "where", label: "The desert" },
            { src: "images/spring.jpg", cat: "when", label: "Spring" }
        ];

        let currentIndex = 0;
        let score = 0;               
        let comboCount = 0;          
        let currentItemFirstTry = true;
        let preferredVoice = null;
        let isAnimating = false;
        
        let categoryStats = {
            who: { correct: 0, incorrect: 0 },
            where: { correct: 0, incorrect: 0 },
            when: { correct: 0, incorrect: 0 },
            what: { correct: 0, incorrect: 0 }
        };
        
        const glowColors = ['#4ade80', '#60a5fa', '#f472b6', '#fbbf24', '#a78bfa'];

        const imgElement = document.getElementById('draggable-image');
        const feedback = document.getElementById('feedback');
        const fill = document.getElementById('progress-fill');
        const currentCountDisplay = document.getElementById('current-count');
        const totalCountDisplay = document.getElementById('total-count');
        const binsBox = document.getElementById('bins-box');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type || 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function loadVoices() {
            if (typeof speechSynthesis === 'undefined') return;
            const voices = window.speechSynthesis.getVoices();
            preferredVoice = voices.find(v => v.name.includes('Google') && v.lang.startsWith('en')) ||
                             voices.find(v => v.lang === 'en-US') ||
                             voices.find(v => v.lang.startsWith('en'));
        }

        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        function shuffleImages(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function initGame() {
            loadVoices();
            shuffleImages(imageData);
            totalCountDisplay.innerText = imageData.length;
            loadItem();
            setupTouchListeners();
        }

        function speakBin(text, preventClearance = false) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (!preventClearance) {
                window.speechSynthesis.cancel();
            }
            
            const utterance = new SpeechSynthesisUtterance(text);
            if (preferredVoice) utterance.voice = preferredVoice;
            
            utterance.rate = 0.95; 
            utterance.pitch = 1.0; 
            window.speechSynthesis.speak(utterance);
        }

        function speakImage() {
            if (currentIndex < imageData.length) {
                speakBin(imageData[currentIndex].label);
            }
        }

        function loadItem() {
            if (currentIndex < imageData.length) {
                currentItemFirstTry = true; 
                
                imgElement.style.transition = 'none';
                imgElement.style.transform = 'none';
                imgElement.style.opacity = '1';
                imgElement.style.zIndex = '';
                
                imgElement.src = imageData[currentIndex].src;
                imgElement.alt = imageData[currentIndex].label;
                currentCountDisplay.innerText = currentIndex + 1;
                const percent = (currentIndex / imageData.length) * 100;
                fill.style.width = percent + "%";
                feedback.innerText = "";

                setTimeout(() => {
                    speakImage();
                }, 100);

            } else {
                document.getElementById('game-screen').classList.add('hidden');
                document.getElementById('win-screen').classList.remove('hidden');
                
                // Fire up the results screen audio track
                const winAudio = document.getElementById('win-audio');
                if (winAudio) {
                    winAudio.play().catch(e => console.log("Audio presentation initialized safely:", e));
                }

                const finalAccuracy = Math.round((score / imageData.length) * 100);
                document.getElementById('win-percentage').innerText = `${finalAccuracy}% Correct`;
                document.getElementById('win-score').innerText = `You scored ${score} out of ${imageData.length} objects correctly on the first try!`;
                
                ['who', 'where', 'when', 'what'].forEach(cat => {
                    document.getElementById(`${cat}-correct`).innerText = categoryStats[cat].correct;
                    document.getElementById(`${cat}-incorrect`).innerText = categoryStats[cat].incorrect;
                });

                if (finalAccuracy >= 80) {
                    document.getElementById('win-title').innerText = "🏆 Master Sorter!";
                    startFireworks();
                    setTimeout(() => speakBin("Master Sorter! Amazing job!"), 1000);
                } else {
                    document.getElementById('win-title').innerText = "🎉 Great Job!";
                    setTimeout(() => speakBin("Great job! You finished!"), 1000);
                }
            }
        }

        function triggerComboGlow() {
            const color = glowColors[(comboCount / 5 - 1) % glowColors.length];
            document.body.style.backgroundColor = color;
            feedback.innerText = `🔥 ${comboCount} COMBO! 🔥`;
            binsBox.style.transform = "scale(1.02)"; 
            
            speakBin(`${comboCount} in a row!`, true);

            setTimeout(() => {
                document.body.style.backgroundColor = "var(--bg-color)";
                binsBox.style.transform = "scale(1)";
            }, 1500);
        }

        function verifyMatch(draggedCategory, targetCategory, binElement) {
            const currentCat = imageData[currentIndex].cat;
            
            if (draggedCategory === targetCategory) {
                playSound(600, 'sine'); 
                feedback.style.color = "#2e7d32";
                feedback.innerText = "⭐ Correct!";
                
                triggerConfetti(binElement);
                
                let nextItemDelay = 500;

                if (currentItemFirstTry) {
                    score++;
                    comboCount++; 
                    categoryStats[currentCat].correct++;
                    if (comboCount > 0 && comboCount % 5 === 0) {
                        triggerComboGlow();
                        nextItemDelay = 1800;
                    }
                }
                
                currentIndex++;
                setTimeout(loadItem, nextItemDelay);
            } else {
                playSound(150, 'sawtooth'); 
                feedback.style.color = "#d32f2f";
                feedback.innerText = "❌ Try again!";
                
                if (currentItemFirstTry) {
                    categoryStats[currentCat].incorrect++;
                }
                currentItemFirstTry = false; 
                comboCount = 0; 
                imgElement.style.animation = "shake 0.3s";
                setTimeout(() => imgElement.style.animation = "", 300);

                let correctiveHint = "";
                if (currentCat === "who") {
                    correctiveHint = "This is a person.";
                } else if (currentCat === "where") {
                    correctiveHint = "This is a place.";
                } else if (currentCat === "when") {
                    correctiveHint = "This is a time.";
                } else if (currentCat === "what") {
                    correctiveHint = "This is a thing.";
                }

                if (correctiveHint) {
                    speakBin(correctiveHint);
                }
            }
        }

        /* --- MOUSE DRAG & DROP EVENTS --- */
        function allowDrop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add('drag-over');
        }

        function dragLeave(ev) {
            ev.currentTarget.classList.remove('drag-over');
        }

        function drag(ev) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            ev.dataTransfer.setData("text", imageData[currentIndex].cat);
            setTimeout(() => { imgElement.style.opacity = '0.4'; }, 0);
        }

        function drop(ev) {
            ev.preventDefault();
            const bin = ev.currentTarget;
            bin.classList.remove('drag-over');
            
            const draggedCategory = ev.dataTransfer.getData("text");
            const targetCategory = bin.getAttribute('data-category');
            
            if (draggedCategory === targetCategory) {
                imgElement.style.transition = 'all 0.3s ease';
                imgElement.style.transform = 'scale(0)';
                imgElement.style.opacity = '0';
            } else {
                imgElement.style.opacity = '1';
            }
            
            verifyMatch(draggedCategory, targetCategory, bin);
        }

        /* --- TOUCHSCREEN HANDLERS FOR TOUCH LAPTOPS & TABLETS --- */
        function setupTouchListeners() {
            let startX = 0, startY = 0;
            let activeBin = null;

            imgElement.addEventListener('touchstart', function(e) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                if (e.touches.length > 0) {
                    const touch = e.touches[0];
                    startX = touch.clientX;
                    startY = touch.clientY;
                    imgElement.style.transition = 'none';
                    imgElement.style.zIndex = '1000';
                }
            }, { passive: true });

            imgElement.addEventListener('touchmove', function(e) {
                if (e.touches.length > 0) {
                    const touch = e.touches[0];
                    const dX = touch.clientX - startX;
                    const dY = touch.clientY - startY;
                    
                    imgElement.style.transform = `translate(${dX}px, ${dY}px)`;
                    
                    imgElement.style.pointerEvents = 'none';
                    const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
                    imgElement.style.pointerEvents = 'auto';
                    
                    const bin = targetElement ? targetElement.closest('.bin') : null;
                    
                    if (bin !== activeBin) {
                        if (activeBin) activeBin.classList.remove('drag-over');
                        activeBin = bin;
                        if (activeBin) activeBin.classList.add('drag-over');
                    }
                    
                    if (e.cancelable) e.preventDefault(); 
                }
            }, { passive: false });

            imgElement.addEventListener('touchend', function(e) {
                if (activeBin) {
                    activeBin.classList.remove('drag-over');
                    const draggedCategory = imageData[currentIndex].cat;
                    const targetCategory = activeBin.getAttribute('data-category');
                    
                    if (draggedCategory === targetCategory) {
                        imgElement.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                        imgElement.style.transform += ' scale(0)';
                        imgElement.style.opacity = '0';
                        
                        verifyMatch(draggedCategory, targetCategory, activeBin);
                    } else {
                        imgElement.style.transition = 'transform 0.2s ease';
                        imgElement.style.transform = 'none';
                        imgElement.style.zIndex = '';
                        verifyMatch(draggedCategory, targetCategory, activeBin);
                    }
                    activeBin = null;
                } else {
                    imgElement.style.transition = 'transform 0.2s ease';
                    imgElement.style.transform = 'none';
                    imgElement.style.zIndex = '';
                }
            });
        }

        function resetGame() {
            window.speechSynthesis.cancel();
            
            // Cease score track playback and rewind to start frame
            const winAudio = document.getElementById('win-audio');
            if (winAudio) {
                winAudio.pause();
                winAudio.currentTime = 0;
            }

            currentIndex = 0;
            score = 0;
            comboCount = 0;
            categoryStats = {
                who: { correct: 0, incorrect: 0 },
                where: { correct: 0, incorrect: 0 },
                when: { correct: 0, incorrect: 0 },
                what: { correct: 0, incorrect: 0 }
            };
            stopFireworks();
            shuffleImages(imageData);
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('win-screen').classList.add('hidden');
            loadItem();
        }

        // FIREWORKS & CONFETTI ENGINE
        let particles = [];
        let animationId;
        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');

        function triggerConfetti(binElement) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const rect = binElement.getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top + rect.height / 2;
            
            for (let i = 0; i < 25; i++) {
                particles.push({
                    x: startX,
                    y: startY,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.6) * 14, 
                    size: Math.random() * 6 + 4,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    gravity: 0.25
                });
            }
            if (!isAnimating) {
                animateFX();
            }
        }

        function startFireworks() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    size: Math.random() * 8 + 4,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    gravity: 0.15
                });
            }
            if (!isAnimating) {
                animateFX();
            }
        }

        function animateFX() {
            isAnimating = true;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.vx *= 0.99;
                p.vy += p.gravity;
                p.x += p.vx;
                p.y += p.vy;
                
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                
                if (p.y > canvas.height || p.x < 0 || p.x > canvas.width) {
                    particles.splice(i, 1);
                }
            }

            if (particles.length > 0) {
                animationId = requestAnimationFrame(animateFX);
            } else {
                isAnimating = false;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function stopFireworks() {
            cancelAnimationFrame(animationId);
            isAnimating = false;
            particles = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        window.onresize = function() {
            if (!document.getElementById('win-screen').classList.contains('hidden') && score/imageData.length >= 0.8) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        };

        window.onload = initGame;
    </script>

    <style>
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
    </style>
</body>
