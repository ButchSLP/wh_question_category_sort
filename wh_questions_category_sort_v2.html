<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who, Where, When, What - Interactive Sort</title>
    <style>
        :root {
            --who-grad: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            --where-grad: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --when-grad: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            --what-grad: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-color: #f0f4f8;
        }

        /* HARD LOCK: Prevent any scrollbars from appearing */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 1.5vh 2vw;
            transition: background-color 0.4s ease;
        }

        *, *:before, *:after {
            box-sizing: border-box;
        }

        /* --- Global Layout Settings --- */
        h1 {
            color: #444;
            margin: 0.5vh 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            font-size: min(2.2rem, 4vh);
            text-align: center;
        }

        p.instruction {
            color: #666;
            margin: 0 0 1vh 0;
            font-size: min(1rem, 1.8vh);
            text-align: center;
        }

        .bins-container {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 1100px;
            gap: 12px;
            padding: 0.5vh;
            transition: transform 0.3s ease;
        }

        .bin {
            flex: 1;
            height: min(135px, 16vh);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            border: 4px solid white;
            position: relative;
        }

        .bin:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .bin h2 { 
            margin: 0; 
            pointer-events: none; 
            text-transform: uppercase; 
            font-size: min(1.4rem, 2.2vh);
            letter-spacing: 1px;
        }

        .bin span.icon {
            font-size: min(2.6rem, 4.2vh);
            pointer-events: none;
            margin-bottom: 2px;
        }

        .bin[data-category="who"] { background: var(--who-grad); color: #912c2c; }
        .bin[data-category="where"] { background: var(--where-grad); color: #1a5e7a; }
        .bin[data-category="when"] { background: var(--when-grad); color: #7a5a1a; }
        .bin[data-category="what"] { background: var(--what-grad); color: white; }

        .bin.drag-over {
            transform: scale(1.05);
            filter: brightness(1.1);
            border-style: dotted;
        }

        .image-area {
            margin-top: 1.5vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            perspective: 1000px;
            gap: 0.5vh;
        }

        .card {
            background: white;
            padding: 1vh;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            position: relative;
            z-index: 1;
        }

        #draggable-image {
            width: min(190px, 23vh);
            height: min(190px, 23vh);
            object-fit: cover;
            border-radius: 12px;
            cursor: grab;
            display: block;
            touch-action: none; /* Prevents native gestures from causing document scroll */
        }

        #draggable-image:active { cursor: grabbing; }

        .progress-bar {
            width: min(350px, 50vw);
            height: 10px;
            background: #ddd;
            border-radius: 10px;
            margin-top: 1vh;
            overflow: hidden;
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background: #4CAF50;
            transition: width 0.3s;
        }

        .progress-text {
            margin-top: 0.5vh;
            font-weight: bold;
            color: #555;
            font-size: min(0.95rem, 1.8vh);
        }

        #feedback {
            height: 4vh;
            font-size: min(1.8rem, 3.2vh);
            font-weight: bold;
            transition: opacity 0.3s;
            position: relative;
            z-index: 10;
            margin-bottom: 0.5vh;
        }

        .hidden { display: none; }

        .win-screen {
            text-align: center;
            padding: 3vh;
            animation: popIn 0.5s ease-out;
        }

        button {
            padding: 1.5vh 4vw;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #388E3C;
            transition: 0.1s;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #388E3C;
        }

        #fx-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* --- LAPTOP/DESKTOP OPTIMIZATIONS (Scroll-Free Bounded) --- */
        @media (min-width: 1025px) {
            body { padding: 1vh 2vw; }
            h1 { font-size: min(2.5rem, 4.5vh); margin-top: 0.5vh; }
            p.instruction { font-size: min(1.1rem, 2vh); margin-bottom: 1vh; }

            .bins-container { max-width: 1100px; gap: 1.5vw; }
            
            .bin {
                height: min(175px, 22vh); 
                border-width: 5px;
                border-radius: 25px;
            }
            .bin h2 { font-size: min(1.8rem, 2.6vh); }
            .bin span.icon { font-size: min(3.5rem, 5vh); margin-bottom: 2px; }

            .image-area {
                margin-top: 3vh; 
                gap: 1vh; 
            }

            #feedback { 
                font-size: min(2.2rem, 3.6vh); 
                height: 4.5vh; 
                line-height: 4.5vh;
            }

            #draggable-image {
                width: min(190px, 23vh); 
                height: min(190px, 23vh);
            }
            .card { padding: 1.2vh; }

            .progress-bar { height: 10px; width: 380px; margin-top: 1vh; }
            .progress-text { font-size: min(1rem, 1.8vh); }
            
            button { font-size: 1.4rem; }
            .win-screen h2 { font-size: 2.5rem; }
            .win-screen p { font-size: 1.3rem; }
        }

        /* Mobile/Portrait Tablet Constraints */
        @media (max-width: 650px) {
            .bins-container {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .bin {
                height: min(95px, 11vh);
            }
            .bin span.icon {
                font-size: min(2rem, 3.5vh);
            }
            .bin h2 {
                font-size: min(1.2rem, 2vh);
            }
            #draggable-image {
                width: min(160px, 22vh);
                height: min(160px, 22vh);
            }
        }
    </style>
</head>
<body>

    <canvas id="fx-canvas"></canvas>

    <h1>Wh-Question Sorting Challenge</h1>
    <p class="instruction">Tap a bin or the picture to hear its name! Drag the picture to the right bin.</p>

    <div class="bins-container" id="bins-box">
        <div class="bin" data-category="who" onclick="speakBin('Who')" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)">
            <span class="icon">👤</span>
            <h2>Who</h2>
        </div>
        <div class="bin" data-category="where" onclick="speakBin('Where')" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)">
            <span class="icon">📍</span>
            <h2>Where</h2>
        </div>
        <div class="bin" data-category="when" onclick="speakBin('When')" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)">
            <span class="icon">🕒</span>
            <h2>When</h2>
        </div>
        <div class="bin" data-category="what" onclick="speakBin('What')" ondrop="drop(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)">
            <span class="icon">📦</span>
            <h2>What</h2>
        </div>
    </div>

    <div id="game-wrap" class="image-area">
        <div id="feedback"></div>
        <div class="card">
            <img id="draggable-image" draggable="true" ondragstart="drag(event)" onclick="speakImage()" src="" alt="Item">
        </div>
        
        <div class="progress-bar">
            <div id="progress-fill"></div>
        </div>
        <div class="progress-text">Progress: <span id="current-count">1</span> / <span id="total-count">0</span></div>
    </div>

    <div id="win-screen" class="win-screen hidden">
        <span style="font-size: min(5rem, 10vh);">🏆</span>
        <h2 id="win-title">Amazing Job!</h2>
        <p id="win-score"></p>
        <button onclick="resetGame()">Play Again</button>
    </div>

    <script>
        let imageData = [
            { src: "https://hips.hearstapps.com/hmg-prod/images/portrait-of-a-happy-young-doctor-in-his-clinic-royalty-free-image-1661432441.jpg?crop=0.66698xw:1xh;center,top&resize=640:*", cat: "who", label: "A doctor" },

            { src: "https://media.istockphoto.com/id/501975952/photo/astronaut.jpg?s=612x612&w=0&k=20&c=Y54AsZb1QR0B1rXiLH53l0G0hLfbmrqc8NLgEem7ndo=", cat: "who", label: "An astronaut" },
            { src: "https://media.istockphoto.com/id/1446199740/photo/path-through-a-sunlit-forest.jpg?s=612x612&w=0&k=20&c=DuozAED7qfI5E6PcVb4bHtFJ_uM_n1duok56j_liLEA=", cat: "where", label: "The forest" },
            { src: "https://media.istockphoto.com/id/2165698066/photo/funny-snowman-in-knitted-hat.jpg?s=612x612&w=0&k=20&c=jSnhCR6QPiu2MlHP6EI6jLiQ62uksKkg4j5CMCo70Pw=", cat: "when", label: "Winter" },
            { src: "https://bimbousa.com/sites/default/files/styles/product_full_image/public/2022-07/Receta-Sandwich-de-pollo-a-la-mostaza-Bimbo_0.jpg?itok=9y0pa3Ql", cat: "what", label: "A sandwich" },
            { src: "https://media.istockphoto.com/id/1313773483/photo/action-portrait-of-male-and-female-firefighting-hose-team.jpg?s=612x612&w=0&k=20&c=yvOeisWZMyaDRdbWhuBsVohoK0TIu0ICJy4KFZv8ODs=", cat: "who", label: "A firefighter" },
            { src: "https://media.istockphoto.com/id/966578102/photo/kids-in-line-crossing-street-to-get-on-school-bus.jpg?s=612x612&w=0&k=20&c=Y6DMwEux2iT3huHAIZ576S_3-fDzNLetpQQdf7nR5_k=", cat: "where", label: "A school" },
            { src: "https://media.istockphoto.com/id/1370783671/photo/portrait-of-a-happy-woman-waking-up-and-stretching-in-bed.jpg?s=612x612&w=0&k=20&c=g3xWKu7zkn6GcIrwZmNj3Div6oU_YSQzv29F8kdgm4Y=", cat: "when", label: "Morning" },
            { src: "https://media.istockphoto.com/id/2178168148/photo/mockup-image-of-a-woman-using-laptop-with-blank-screen-on-wooden-table.jpg?s=612x612&w=0&k=20&c=bPDbm5TXwfEX4BzN5ANkvKTrB2X2yYKoGheULsTEebo=", cat: "what", label: "A laptop" },
            { src: "https://st5.depositphotos.com/78368394/74555/i/450/depositphotos_745552886-stock-photo-loving-embrace-young-girl-kisses.jpg", cat: "who", label: "A grandmother" },
            { src: "https://img.freepik.com/free-photo/outer-space-background_53876-88651.jpg?semt=ais_hybrid&w=740&q=80", cat: "where", label: "Outer space" },
            { src: "https://media.istockphoto.com/id/1038696838/photo/autumn-forest-beautiful-rural-scenery.jpg?s=612x612&w=0&k=20&c=dSgKaX5o7leD7a4jgprpWCVPp7X6_XyXhS9Cl70gIIk=", cat: "when", label: "Autumn" },
            { src: "https://r2.gear4music.com/media/6/67813/600/preview.jpg", cat: "what", label: "A guitar" },
            { src: "https://media.istockphoto.com/id/1194692009/photo/cute-happy-7-month-baby-girl-in-diaper-lying-and-playing.jpg?s=612x612&w=0&k=20&c=izwRgpBPObR4y7J2lTk8hyWmIo-Vbe-hSJmYFzgDatA=", cat: "who", label: "A baby" },
            { src: "https://static.vecteezy.com/system/resources/thumbnails/019/961/772/small/panoramic-view-of-passo-giau-in-the-dolomite-mountains-of-italy-photo.jpg", cat: "where", label: "A mountain" },
            { src: "https://media.istockphoto.com/id/1031379514/photo/young-school-kids-eating-lunch-talking-at-a-table-together.jpg?s=612x612&w=0&k=20&c=0oZ7r2i0L8sQgAjvVKiTauLvq6GMnSpWFZ4b7no6lyc=", cat: "when", label: "Lunch time" },
            { src: "https://media.istockphoto.com/id/2167589456/photo/yellow-backpack-opened-isolated-on-white-school-bag-advertisement-design-knapsack-rucksack.jpg?s=612x612&w=0&k=20&c=5B7A5M35ZEcneBbRoLWkIpPcij1HKTdPtkXEm71MMKI=", cat: "what", label: "A backpack" },
            { src: "https://media.istockphoto.com/id/2163767427/photo/microscope-woman-check-and-virus-research-of-science-study-with-healthcare-scientist-and.jpg?s=612x612&w=0&k=20&c=Rzej2WyclqIqHRl3Bhzjpc9k4qvjUK-P1ucRBtxCQl0=", cat: "who", label: "A scientist" },
            { src: "https://media.istockphoto.com/id/2045414752/photo/a-small-white-kitchen-with-a-grey-subway-tile-backsplash.jpg?s=612x612&w=0&k=20&c=51iKrCSTRY9UonwlmRgrT1Gg90u53Pbguo_y-RPmVlQ=", cat: "where", label: "The kitchen" },
            { src: "https://media.istockphoto.com/id/1324640888/photo/a-beautiful-girl-in-the-pool-on-an-inflatable-donut-is-having-fun-on-a-hot-summer-day.jpg?s=612x612&w=0&k=20&c=J0tFkUMMnCIVu86lKqofwVe2giORMwLXNN12pEBNUts=", cat: "when", label: "Summer" },
            { src: "https://generaltools.com/media/catalog/product/cache/3484951863af3b735b8c89499e76300e/w/s/ws-1001_1000px_1.jpg", cat: "what", label: "A hammer" },
            { src: "https://media.istockphoto.com/id/666908954/photo/handsome-chef-pouring-olive-oil-on-meal.jpg?s=612x612&w=0&k=20&c=2dU_sMyn3GM2N81m-tMWQ4y5frBp87GQCflUtauJM4k=", cat: "who", label: "A chef" },
            { src: "https://media.istockphoto.com/id/831651876/photo/bookshelf-in-public-library.jpg?s=612x612&w=0&k=20&c=NlJb0Uh42B1tDR2PqKa9wDp2ENxOPkZ_-6dQmw62KVM=", cat: "where", label: "A library" },
            { src: "https://marketplace.canva.com/i6hl4/MAGybbi6hl4/1/tl/canva-sunrise-over-mountain-landscape-MAGybbi6hl4.jpg", cat: "when", label: "Sunrise" },
            { src: "https://media.istockphoto.com/id/182499738/photo/red-umbrella-isolated-on-a-white-background.jpg?s=612x612&w=0&k=20&c=-4DdM6YYgscI7-RrqU_NBRUe-7xdcaHVJvAHi4fqhcM=", cat: "what", label: "An umbrella" },
            { src: "https://cdn.phenompeople.com/CareerConnectResources/pp/SOUTUS/images/FOKizna600x471-1752695853310.png", cat: "who", label: "A pilot" },
            { src: "https://media.istockphoto.com/id/863542630/photo/summer-sunset-with-a-red-barn-in-rural-montana-and-rocky-mountains.jpg?s=612x612&w=0&k=20&c=c0-_YxwHBEbwL0SpzPrF_mWGlEtX2GQzPaezpn_o0EY=", cat: "where", label: "A farm" },
            { src: "https://media.istockphoto.com/id/1407960946/photo/mother-putting-blanket-on-and-stroking-head-for-her-little-girl-daughter-on-bed-in-a-dark.jpg?s=612x612&w=0&k=20&c=ljMTJb3mOvakhzNjw8u6txZZXDcx9-TUqhQAJPQTCmc=", cat: "when", label: "Bedtime" },
            { src: "https://media.istockphoto.com/id/185278433/photo/black-digital-slr-camera-in-a-white-background.jpg?s=612x612&w=0&k=20&c=OOCbhvOF0W-eVhhrm-TxbgLfbKhFfs4Lprjd7hiQBNU=", cat: "what", label: "A camera" },
            { src: "https://img.freepik.com/free-vector/regal-king-with-crown-illustration_1308-177407.jpg", cat: "who", label: "A king" },
            { src: "https://media.istockphoto.com/id/1422474265/photo/desert-wahiba-sands-in-oman-near-east.jpg?s=612x612&w=0&k=20&c=1lgJL_YJRVscR70vQWbhuNPRgJY4aA38lf-LS9bWfAE=", cat: "where", label: "The desert" },
            { src: "https://media.istockphoto.com/id/1301592082/photo/beautiful-meadow-field-with-fresh-grass-and-yellow-dandelion-flowers-in-nature.jpg?s=612x612&w=0&k=20&c=fbTwYcoItgf2lc6fMx6d53s7qxW8CNVKr_RXVaVbnZM=", cat: "when", label: "Spring" }
        ];

        let currentIndex = 0;
        let score = 0;               
        let comboCount = 0;          
        let currentItemFirstTry = true;
        
        const glowColors = ['#4ade80', '#60a5fa', '#f472b6', '#fbbf24', '#a78bfa'];

        const imgElement = document.getElementById('draggable-image');
        const feedback = document.getElementById('feedback');
        const fill = document.getElementById('progress-fill');
        const currentCountDisplay = document.getElementById('current-count');
        const totalCountDisplay = document.getElementById('total-count');
        const binsBox = document.getElementById('bins-box');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type || 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function shuffleImages(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function initGame() {
            shuffleImages(imageData);
            totalCountDisplay.innerText = imageData.length;
            loadItem();
            setupTouchListeners();
        }

        function speakBin(text) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            utterance.pitch = 1.1; 
            window.speechSynthesis.speak(utterance);
        }

        function speakImage() {
            if (currentIndex < imageData.length) {
                speakBin(imageData[currentIndex].label);
            }
        }

        function loadItem() {
            if (currentIndex < imageData.length) {
                currentItemFirstTry = true; 
                
                // Clear any layout overrides used during animations
                imgElement.style.transition = 'none';
                imgElement.style.transform = 'none';
                imgElement.style.opacity = '1';
                imgElement.style.zIndex = '';
                
                imgElement.src = imageData[currentIndex].src;
                imgElement.alt = imageData[currentIndex].label;
                currentCountDisplay.innerText = currentIndex + 1;
                const percent = (currentIndex / imageData.length) * 100;
                fill.style.width = percent + "%";
                feedback.innerText = "";

                setTimeout(() => {
                    speakImage();
                }, 50);

            } else {
                fill.style.width = "100%";
                document.getElementById('game-wrap').classList.add('hidden');
                document.getElementById('win-screen').classList.remove('hidden');
                
                const finalAccuracy = (score / imageData.length) * 100;
                document.getElementById('win-score').innerText = `You got ${score} out of ${imageData.length} correct on the first try!`;
                
                if (finalAccuracy >= 80) {
                    document.getElementById('win-title').innerText = "🏆 Master Sorter!";
                    startFireworks();
                    setTimeout(() => speakBin("Master Sorter! Amazing job!"), 1000);
                } else {
                    setTimeout(() => speakBin("Great job! You finished!"), 1000);
                }
            }
        }

        function triggerComboGlow() {
            const color = glowColors[(comboCount / 5 - 1) % glowColors.length];
            document.body.style.backgroundColor = color;
            feedback.innerText = `🔥 ${comboCount} COMBO! 🔥`;
            binsBox.style.transform = "scale(1.02)"; 
            
            window.speechSynthesis.cancel();
            speakBin(`${comboCount} in a row!`);

            setTimeout(() => {
                document.body.style.backgroundColor = "var(--bg-color)";
                binsBox.style.transform = "scale(1)";
            }, 1200);
        }

        function verifyMatch(draggedCategory, targetCategory, binElement) {
            if (draggedCategory === targetCategory) {
                window.speechSynthesis.cancel(); 
                playSound(600, 'sine'); 
                feedback.style.color = "#2e7d32";
                feedback.innerText = "⭐ Correct!";
                
                if (currentItemFirstTry) {
                    score++;
                    comboCount++; 
                    if (comboCount > 0 && comboCount % 5 === 0) {
                        triggerComboGlow();
                    }
                }
                
                currentIndex++;
                setTimeout(loadItem, 500);
            } else {
                playSound(150, 'sawtooth'); 
                feedback.style.color = "#d32f2f";
                feedback.innerText = "❌ Try again!";
                currentItemFirstTry = false; 
                comboCount = 0; 
                imgElement.style.animation = "shake 0.3s";
                setTimeout(() => imgElement.style.animation = "", 300);
            }
        }

        /* --- MOUSE DRAG & DROP EVENTS --- */
        function allowDrop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add('drag-over');
        }

        function dragLeave(ev) {
            ev.currentTarget.classList.remove('drag-over');
        }

        function drag(ev) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            ev.dataTransfer.setData("text", imageData[currentIndex].cat);
            
            // Mouse dragging fade effect
            setTimeout(() => { imgElement.style.opacity = '0.4'; }, 0);
        }

        function drop(ev) {
            ev.preventDefault();
            const bin = ev.currentTarget;
            bin.classList.remove('drag-over');
            
            const draggedCategory = ev.dataTransfer.getData("text");
            const targetCategory = bin.getAttribute('data-category');
            
            if (draggedCategory === targetCategory) {
                imgElement.style.transition = 'all 0.3s ease';
                imgElement.style.transform = 'scale(0)';
                imgElement.style.opacity = '0';
            } else {
                imgElement.style.opacity = '1';
            }
            
            verifyMatch(draggedCategory, targetCategory, bin);
        }

        /* --- TOUCHSCREEN HANDLERS FOR TOUCH LAPTOPS & TABLETS --- */
        function setupTouchListeners() {
            let startX = 0, startY = 0;
            let activeBin = null;

            imgElement.addEventListener('touchstart', function(e) {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                if (e.touches.length > 0) {
                    const touch = e.touches[0];
                    startX = touch.clientX;
                    startY = touch.clientY;
                    imgElement.style.transition = 'none';
                    imgElement.style.zIndex = '1000';
                }
            }, { passive: true });

            imgElement.addEventListener('touchmove', function(e) {
                if (e.touches.length > 0) {
                    const touch = e.touches[0];
                    const dX = touch.clientX - startX;
                    const dY = touch.clientY - startY;
                    
                    // Move card fluidly matching coordinate drift
                    imgElement.style.transform = `translate(${dX}px, ${dY}px)`;
                    
                    // Bypass card structure to read targeted bin container layer coordinates below
                    imgElement.style.pointerEvents = 'none';
                    const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
                    imgElement.style.pointerEvents = 'auto';
                    
                    const bin = targetElement ? targetElement.closest('.bin') : null;
                    
                    if (bin !== activeBin) {
                        if (activeBin) activeBin.classList.remove('drag-over');
                        activeBin = bin;
                        if (activeBin) activeBin.classList.add('drag-over');
                    }
                    
                    if (e.cancelable) e.preventDefault(); 
                }
            }, { passive: false });

            imgElement.addEventListener('touchend', function(e) {
                if (activeBin) {
                    activeBin.classList.remove('drag-over');
                    const draggedCategory = imageData[currentIndex].cat;
                    const targetCategory = activeBin.getAttribute('data-category');
                    
                    if (draggedCategory === targetCategory) {
                        // Correct touch drop: Collapse and vanish directly inside the bin location!
                        imgElement.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                        imgElement.style.transform += ' scale(0)';
                        imgElement.style.opacity = '0';
                        
                        verifyMatch(draggedCategory, targetCategory, activeBin);
                    } else {
                        // Incorrect touch drop: Snap back to center card instantly, then apply shake action
                        imgElement.style.transition = 'transform 0.2s ease';
                        imgElement.style.transform = 'none';
                        imgElement.style.zIndex = '';
                        verifyMatch(draggedCategory, targetCategory, activeBin);
                    }
                    activeBin = null;
                } else {
                    // No bin targeted: Snap safely back to home container
                    imgElement.style.transition = 'transform 0.2s ease';
                    imgElement.style.transform = 'none';
                    imgElement.style.zIndex = '';
                }
            });
        }

        function resetGame() {
            window.speechSynthesis.cancel();
            currentIndex = 0;
            score = 0;
            comboCount = 0;
            stopFireworks();
            shuffleImages(imageData);
            document.getElementById('game-wrap').classList.remove('hidden');
            document.getElementById('win-screen').classList.add('hidden');
            loadItem();
        }

        // FIREWORKS ENGINE
        let particles = [];
        let animationId;
        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');

        function startFireworks() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    size: Math.random() * 8 + 4,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    gravity: 0.15
                });
            }
            animateFX();
        }

        function animateFX() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.vx *= 0.99;
                p.vy += p.gravity;
                p.x += p.vx;
                p.y += p.vy;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                if (p.y > canvas.height) particles.splice(i, 1);
            });
            if (particles.length > 0) {
                animationId = requestAnimationFrame(animateFX);
            }
        }

        function stopFireworks() {
            cancelAnimationFrame(animationId);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        window.onresize = function() {
            if (!document.getElementById('win-screen').classList.contains('hidden') && score/imageData.length >= 0.8) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        };

        window.onload = initGame;
    </script>

    <style>
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
    </style>
</body>
